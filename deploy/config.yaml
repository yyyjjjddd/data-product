spring:
  application:
    name: metrics-config-service
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:metrics_db}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=${TZ:Asia/Shanghai}&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    schema: classpath:schema.sql
    initialization-mode: always
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 30000
      pool-name: MetricsHikariCP
      max-lifetime: 1800000
      connection-timeout: 30000

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 1
        retry:
          enabled: true
          initial-interval: 1000
          max-attempts: 3
          max-interval: 10000

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.example.metrics.model.entity
  configuration:
    map-underscore-to-camel-case: true
    default-statement-timeout: 30

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    root: INFO
    com.example.metrics: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"