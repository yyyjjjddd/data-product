server:
  port: 8080

spring:
  application:
    name: metrics-config-service
  profiles:
    active: dev

  datasource:
    url: jdbc:mysql://localhost:3306/metrics_db?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 30000
      pool-name: MetricsHikariCP
      max-lifetime: 1800000
      connection-timeout: 30000

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    virtual-host: /
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 1
        retry:
          enabled: true
          initial-interval: 1000
          max-attempts: 3
          max-interval: 10000

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.example.metrics.model.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    # ????????????????????????
    default-statement-timeout: 30

logging:
  level:
    root: INFO
    com.example.metrics: DEBUG
    com.example.metrics.mapper: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

security:
  cors:
    allowed-origins: http://localhost:8080
  url:
    whitelist: /api/public,/api/health
